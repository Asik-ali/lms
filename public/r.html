<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071a3d" />
    <title>Open EXAMSTICK</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #071a3d; color: #fff; font: 16px system-ui, sans-serif; }
      main { max-width: 26rem; padding: 2rem; text-align: center; }
      a { color: #ffd66b; }
    </style>
  </head>
  <body>
    <main><p>Opening EXAMSTICK signup…</p><a id="fallback" href="https://play.google.com/store/apps/details?id=com.lms.portal">Get EXAMSTICK on Google Play</a></main>
    <script>
      const code = new URLSearchParams(location.search).get('code') || location.pathname.split('/').filter(Boolean).pop() || '';
      if (!/^[A-Za-z0-9_-]{1,32}$/.test(code)) {
        document.querySelector('main').innerHTML = '<p>This referral link is invalid.</p>';
      } else {
        const playStore = 'https://play.google.com/store/apps/details?id=com.lms.portal';
        const intent = `intent://asiklms.vercel.app/r/${code}#Intent;scheme=https;package=com.lms.portal;S.browser_fallback_url=${encodeURIComponent(playStore)};end`;
        location.replace(intent);
      }
    </script>
  </body>
</html>
