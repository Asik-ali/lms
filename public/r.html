<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071a3d" />
    <title>Open EXAMSTICK</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #071a3d; color: #fff; font: 16px system-ui, sans-serif; }
      main { max-width: 26rem; padding: 2rem; text-align: center; }
      .actions { display: flex; flex-direction: column; gap: .8rem; margin-top: 1.5rem; }
      a { display: block; border-radius: .75rem; padding: .85rem 1rem; color: #071a3d; background: #ffd66b; font-weight: 700; text-decoration: none; }
      a.secondary { color: #fff; background: #173967; }
    </style>
  </head>
  <body>
    <main>
      <p id="message">Opening EXAMSTICK signup…</p>
      <div class="actions">
        <a id="open-app" href="#">Open EXAMSTICK</a>
        <a id="play-store" class="secondary" href="https://play.google.com/store/apps/details?id=com.lms.portal">Get EXAMSTICK on Google Play</a>
      </div>
    </main>
    <script>
      const code = new URLSearchParams(location.search).get('code') || location.pathname.split('/').filter(Boolean).pop() || '';
      if (!/^[A-Za-z0-9_-]{1,32}$/.test(code)) {
        document.querySelector('main').innerHTML = '<p>This referral link is invalid.</p>';
      } else {
        const intent = `intent://asiklms.vercel.app/r/${code}#Intent;scheme=https;package=com.lms.portal;end`;
        document.getElementById('open-app').href = intent;
        if (/Android/i.test(navigator.userAgent)) {
          // Do not send users to Play Store just because Android blocked a
          // script-initiated intent; leave a tap-to-open app link as fallback.
          location.href = intent;
          setTimeout(() => {
            if (document.visibilityState === 'visible') {
              document.getElementById('message').textContent = 'If EXAMSTICK did not open, tap Open EXAMSTICK below.';
            }
          }, 1200);
        } else {
          document.getElementById('message').textContent = 'Open this link on your Android device to continue to EXAMSTICK.';
        }
      }
    </script>
  </body>
</html>
