<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="EXAMSTICK" />
    <meta property="og:site_name" content="EXAMSTICK" />
    <title>EXAMSTICK</title>
    <link rel="stylesheet" href="/startup.css" />
    <script>
      try {
        var startupTheme = localStorage.getItem('theme');
        if (startupTheme !== 'light' && startupTheme !== 'dark') startupTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.startupTheme = startupTheme;
        document.documentElement.classList.toggle('dark', startupTheme === 'dark');
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root">
      <div class="app-loader" role="status" aria-live="polite">
        <div class="boot-scene" aria-hidden="true"><div class="boot-halo"></div><div class="boot-book"><span class="boot-book-label">E</span><span class="boot-book-lines"></span><span class="boot-book-badge">✦</span></div><div class="boot-book-shadow"></div></div>
        <p class="boot-eyebrow">YOUR NEXT CHAPTER</p>
        <h1 class="boot-brand">EXAM<span>STICK</span></h1>
        <p id="startup-message" class="boot-message">Preparing your learning workspace...</p>
        <div class="boot-progress" aria-hidden="true"><span></span></div>
        <button id="startup-reload" class="boot-reload" hidden>Reload</button>
        <p class="boot-caption">Learn. Practice. Move forward.</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
